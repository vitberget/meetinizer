[package]
name = "meetinizer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
async-stream = "0.3.6"
axum = { version = "0.8.4", features = ["macros"] }
axum-extra = { version = "0.12.2", features = ["cookie"] }
base64 = "0.23.1"
chrono = {version="0.4.42", features = ["serde"]}
clap = { version = "4.5.47", features = ["derive"] }
clap_complete = "4.5.57"
config = "0.15.15"
cookie = "0.18.1"
futures-util = "0.3.31"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
mail-send = "0.6.0"
otp = "0.2.0"
rand = "0.10.1"
refinery = { version = "0.9.2", features = ["rusqlite"] }
rpassword = "7.4.0"
rusqlite = { version = "0.39.0", features = ["bundled"]}
rust-argon2 = "3.0.0"
serde = { version = "1.0.225", features = ["derive", "serde_derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uri_encode = "1.0.4"
urlencoding = "2.1.3"
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "reqwest"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
